<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Planner - Unchaos Sage Studio</title>
  
  <!-- Premium Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Playfair+Display:ital,wght=0,600;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sheets: {
              text: '#22252a',
              border: '#d1dbd1',
              headerBg: '#fbfcfb',
            },
            sage: {
              50: '#f4f7f4',
              100: '#e8f0e8',
              200: '#cbdccb',
              300: '#adc8ad',
              600: '#4a704a',
              700: '#3c5a3c',
              800: '#2d432d',
              900: '#1f2e1f',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7f4;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #eef3ee;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #adc8ad;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4a704a;
    }
  </style>
</head>
<body class="custom-scrollbar">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Local Storage Mock Engine
    if (typeof window !== "undefined" && !window.storage) {
      window.storage = {
        get: async (key) => {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        },
        set: async (key, value) => {
          localStorage.setItem(key, value);
        }
      };
    }

    // Monday - Sunday Sequence
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const DAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      // Adjust offset to find previous Monday (Monday is day 1, Sunday is 0)
      const diff = day === 0 ? -6 : 1 - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function fmtDate(date) {
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    // Timezone safe helper to get YYYY-MM-DD from local date
    function getLocalYMD(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // High fidelity circular ring matching Google Sheets donut charts
    function CircularDonut({ pct, size = 76, strokeWidth = 8 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (pct / 100) * circumference;
      
      return (
        <svg width={size} height={size} className="transform -rotate-90">
          <circle
            cx={size / 2}
            cy={size / 2}
            r={radius}
            fill="transparent"
            stroke="#eef5ee"
            strokeWidth={strokeWidth}
          />
          <circle
            cx={size / 2}
            cy={size / 2}
            r={radius}
            fill="transparent"
            stroke="#4a704a"
            strokeWidth={strokeWidth}
            strokeDasharray={circumference}
            strokeDashoffset={strokeDashoffset}
            strokeLinecap="round"
            className="transition-all duration-500"
          />
        </svg>
      );
    }

    function App() {
      const [weekStart, setWeekStart] = useState(() => getMonday(new Date()));
      const [focus, setFocus] = useState("Finish the weekly report 📝");
      const [reward, setReward] = useState("Movie night, no guilt 🍿");
      const [affirmation, setAffirmation] = useState("Progress over perfection. ✨");

      // Initializing high-fidelity tasks
      const [tasks, setTasks] = useState({
        "Monday": [
          { id: 8, text: "Secondary work task", done: true },
          { id: 9, text: "Admin tasks", done: true },
          { id: 10, text: "Clean kitchen", done: false }
        ],
        "Tuesday": [],
        "Wednesday": [],
        "Thursday": [],
        "Friday": [],
        "Saturday": [
          { id: 1, text: "Deep work block", done: true },
          { id: 2, text: "Review priorities", done: true },
          { id: 3, text: "Gym / movement", done: true },
          { id: 4, text: "Weekly finances", done: true }
        ],
        "Sunday": [
          { id: 5, text: "Clean apartment", done: true },
          { id: 6, text: "Gym / movement", done: false }
        ]
      });

      const [habits, setHabits] = useState([
        { id: 1, name: "Wake up at 6:30", days: [true, true, true, true, true, true, false] },
        { id: 2, name: "Drink 2L of water", days: [true, true, true, true, true, true, false] },
        { id: 3, name: "Cold shower", days: [true, true, true, true, true, true, false] },
        { id: 4, name: "Gym", days: [true, true, true, true, true, true, false] },
        { id: 5, name: "Reading 10 pages", days: [true, true, true, true, true, true, false] },
        { id: 6, name: "Budget tracking", days: [true, true, true, true, true, true, false] },
        { id: 7, name: "Studying", days: [true, true, true, true, true, true, false] },
        { id: 8, name: "Meditation", days: [true, true, true, true, true, true, false] },
        { id: 9, name: "No vape", days: [true, true, true, true, true, true, false] }
      ]);

      const [newTaskInputs, setNewTaskInputs] = useState({});
      const [newHabitInput, setNewHabitInput] = useState("");

      // Automatically load saved state when weekStart changes
      useEffect(() => {
        (async () => {
          const wk = getLocalYMD(weekStart);
          try {
            const r = await window.storage.get(`unchaos_sheets_${wk}`);
            if (r) {
              const d = JSON.parse(r.value);
              setFocus(d.focus || "");
              setReward(d.reward || "");
              setAffirmation(d.affirmation || "");
              setTasks(d.tasks || {
                "Monday": [], "Tuesday": [], "Wednesday": [], "Thursday": [], "Friday": [], "Saturday": [], "Sunday": []
              });
              setHabits(d.habits || habits.map(h => ({ ...h, days: Array(7).fill(false) })));
            } else {
              // If no record exists, keep structure with clear days
              setTasks({
                "Monday": [], "Tuesday": [], "Wednesday": [], "Thursday": [], "Friday": [], "Saturday": [], "Sunday": []
              });
              setHabits(habits.map(h => ({ ...h, days: Array(7).fill(false) })));
            }
          } catch (e) {}
        })();
      }, [weekStart]);

      // Save state
      const saveToLocal = async () => {
        const wk = getLocalYMD(weekStart);
        try {
          await window.storage.set(`unchaos_sheets_${wk}`, JSON.stringify({ focus, reward, affirmation, tasks, habits }));
        } catch (e) {}
      };

      useEffect(() => {
        saveToLocal();
      }, [focus, reward, affirmation, tasks, habits]);

      // Adjusting start of the week via date input
      const handleDateChange = (dateString) => {
        if (!dateString) return;
        const selectedDate = new Date(dateString);
        // Find and set the weekStart to Monday of the chosen week
        const calculatedMonday = getMonday(selectedDate);
        setWeekStart(calculatedMonday);
      };

      // Navigation weeks
      const handlePrevWeek = () => setWeekStart(d => addDays(d, -7));
      const handleNextWeek = () => setWeekStart(d => addDays(d, 7));

      // Task actions
      const handleAddTask = (day) => {
        const txt = (newTaskInputs[day] || "").trim();
        if (!txt) return;
        setTasks(prev => ({
          ...prev,
          [day]: [...(prev[day] || []), { id: Date.now(), text: txt, done: false }]
        }));
        setNewTaskInputs(prev => ({ ...prev, [day]: "" }));
      };

      const handleToggleTask = (day, id) => {
        setTasks(prev => ({
          ...prev,
          [day]: prev[day].map(t => t.id === id ? { ...t, done: !t.done } : t)
        }));
      };

      const handleDeleteTask = (day, id) => {
        setTasks(prev => ({
          ...prev,
          [day]: prev[day].filter(t => t.id !== id)
        }));
      };

      // Habit actions
      const handleToggleHabitDay = (habitId, dayIdx) => {
        setHabits(prev => prev.map(h => {
          if (h.id === habitId) {
            const newDays = [...h.days];
            newDays[dayIdx] = !newDays[dayIdx];
            return { ...h, days: newDays };
          }
          return h;
        }));
      };

      const handleAddHabit = () => {
        const txt = newHabitInput.trim();
        if (!txt) return;
        setHabits(prev => [
          ...prev,
          { id: Date.now(), name: txt, days: Array(7).fill(false) }
        ]);
        setNewHabitInput("");
      };

      const handleDeleteHabit = (id) => {
        setHabits(prev => prev.filter(h => h.id !== id));
      };

      const handleClear = () => {
        if (confirm("Reset current week to defaults?")) {
          setTasks({ Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: [] });
          setHabits(habits.map(h => ({ ...h, days: Array(7).fill(false) })));
          setFocus("");
          setReward("");
          setAffirmation("");
        }
      };

      // Metrics calculation
      const totalTasks = Object.values(tasks).reduce((acc, curr) => acc + curr.length, 0);
      const completedTasks = Object.values(tasks).reduce((acc, curr) => acc + curr.filter(t => t.done).length, 0);
      const overallProgress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

      return (
        <div className="min-h-screen text-sheets-text flex flex-col font-sans select-none pb-12">
          
          {/* Header Branding Panel */}
          <div className="bg-[#4a704a] text-white px-8 py-5 shadow-md flex items-center justify-between shrink-0 mb-6">
            <div className="flex items-center gap-3">
              <span className="text-xl font-bold tracking-wider uppercase font-serif">unchaos</span>
              <span className="text-xs bg-sage-800 text-sage-100 font-mono font-medium px-2.5 py-1 rounded-full border border-sage-700">
                Premium Architecture Workspace
              </span>
            </div>
            <div className="text-sm font-medium tracking-wide">
              Logged in offline mode. Sync: <span className="text-emerald-300 font-bold">Active</span>
            </div>
          </div>

          {/* Master Dashboard Container */}
          <div className="flex-1 max-w-[1450px] mx-auto w-full px-6 space-y-6">
            
            {/* Main Dashboard Control Matrix */}
            <div className="grid grid-cols-12 gap-5">
              
              {/* Date & Week Cycle adjustments */}
              <div className="col-span-3 bg-white border border-sage-200 rounded-xl p-5 shadow-sm hover:border-sage-300 transition duration-200 flex flex-col justify-between">
                <div>
                  <div className="text-xs font-bold text-sage-800 mb-2 uppercase tracking-wider flex items-center gap-1.5">
                    <span>Active Week Adjustment</span> 🗓
                  </div>
                  
                  {/* Custom functional calendar date input */}
                  <input 
                    type="date" 
                    className="w-full bg-sage-50 border border-sage-200 text-sm py-2 px-3 rounded-lg font-mono text-sage-900 outline-none focus:border-sage-600 transition"
                    value={getLocalYMD(weekStart)}
                    onChange={(e) => handleDateChange(e.target.value)}
                  />
                </div>

                <div className="mt-4">
                  {/* Step controls for shifting weeks */}
                  <div className="flex gap-2 mb-3">
                    <button 
                      onClick={handlePrevWeek} 
                      className="flex-1 bg-sage-100 hover:bg-sage-200 text-sage-800 text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-1"
                    >
                      ◀ Previous
                    </button>
                    <button 
                      onClick={handleNextWeek} 
                      className="flex-1 bg-sage-100 hover:bg-sage-200 text-sage-800 text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-1"
                    >
                      Next ▶
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button 
                      onClick={saveToLocal}
                      className="bg-sage-700 hover:bg-sage-800 text-white font-mono text-xs py-2 rounded-lg font-bold shadow-sm flex items-center justify-center gap-1.5 transition"
                    >
                      Save Week 💾
                    </button>
                    <button 
                      onClick={handleClear}
                      className="bg-white hover:bg-sage-50 text-sage-700 border border-sage-300 font-mono text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-1.5"
                    >
                      Reset 🧹
                    </button>
                  </div>
                </div>
              </div>

              {/* Weekly Focus, Reward, Affirmation Inputs */}
              <div className="col-span-5 bg-white border border-sage-200 rounded-xl p-5 shadow-sm grid grid-cols-3 gap-4 hover:border-sage-300 transition duration-200">
                <div className="flex flex-col justify-between">
                  <div className="text-xs font-bold text-sage-800 mb-1.5 uppercase tracking-wider flex items-center gap-1">
                    <span>Weekly focus</span> 🎯
                  </div>
                  <textarea 
                    className="flex-1 w-full bg-sage-50/50 border border-sage-200 rounded-lg p-2.5 text-xs text-gray-700 outline-none focus:border-sage-600 resize-none transition"
                    value={focus}
                    onChange={(e) => setFocus(e.target.value)}
                    placeholder="Input primary focus..."
                  />
                </div>

                <div className="flex flex-col justify-between">
                  <div className="text-xs font-bold text-sage-800 mb-1.5 uppercase tracking-wider flex items-center gap-1">
                    <span>Reward</span> 🏆
                  </div>
                  <textarea 
                    className="flex-1 w-full bg-sage-50/50 border border-sage-200 rounded-lg p-2.5 text-xs text-gray-700 outline-none focus:border-sage-600 resize-none transition"
                    value={reward}
                    onChange={(e) => setReward(e.target.value)}
                    placeholder="Input target reward..."
                  />
                </div>

                <div className="flex flex-col justify-between">
                  <div className="text-xs font-bold text-sage-800 mb-1.5 uppercase tracking-wider flex items-center gap-1">
                    <span>Affirmation</span> 🧠
                  </div>
                  <textarea 
                    className="flex-1 w-full bg-sage-50/50 border border-sage-200 rounded-lg p-2.5 text-xs text-gray-700 outline-none focus:border-sage-600 resize-none transition"
                    value={affirmation}
                    onChange={(e) => setAffirmation(e.target.value)}
                    placeholder="Input affirmation..."
                  />
                </div>
              </div>

              {/* Progress and Visual Meters */}
              <div className="col-span-4 bg-white border border-sage-200 rounded-xl p-5 shadow-sm flex items-center justify-between gap-5 hover:border-sage-300 transition duration-200">
                <div className="flex-1 flex flex-col justify-between h-full">
                  <div className="text-xs font-bold text-sage-800 mb-1 uppercase tracking-wider">
                    Overall Progress
                  </div>
                  
                  {/* Visual columns showing performance index per day */}
                  <div className="flex items-end justify-between gap-1.5 h-16 mt-2">
                    {DAYS.map((day, i) => {
                      const dayTasks = tasks[day] || [];
                      const pct = dayTasks.length ? Math.round((dayTasks.filter(t => t.done).length / dayTasks.length) * 100) : 0;
                      return (
                        <div key={day} className="flex-1 flex flex-col items-center justify-end h-full">
                          <div className="w-full bg-zinc-100 rounded-md h-full relative overflow-hidden border border-gray-100">
                            <div 
                              className="bg-sage-600 absolute bottom-0 w-full rounded-md transition-all duration-500"
                              style={{ height: `${pct}%` }}
                            />
                          </div>
                          <span className="text-[10px] font-mono font-bold text-gray-400 mt-1 uppercase">
                            {DAY_SHORT[i]}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Main Target Donut progress indicator */}
                <div className="flex flex-col items-center justify-center shrink-0 border-l border-gray-100 pl-4 h-full">
                  <div className="relative flex items-center justify-center">
                    <CircularDonut pct={overallProgress} size={74} strokeWidth={6.5} />
                    <span className="absolute font-mono text-[14px] font-bold text-sage-900">{overallProgress}%</span>
                  </div>
                  <span className="text-[10px] font-mono font-bold mt-2 text-gray-500 text-center leading-none">
                    {completedTasks}/{totalTasks} tasks
                  </span>
                </div>
              </div>

            </div>

            {/* Habit Tracker Matrix Section */}
            <div className="bg-white border border-sage-200 rounded-xl p-5 shadow-sm">
              <div className="flex items-center justify-between mb-4 border-b border-sage-100 pb-3">
                <h3 className="text-sm font-bold text-sage-900 uppercase tracking-wider flex items-center gap-1.5">
                  <span>Habit Tracker Matrix</span> 📊
                </h3>
                <div className="flex items-center gap-3">
                  <input 
                    type="text" 
                    placeholder="Add new habit routine..." 
                    className="bg-sage-50 border border-sage-200 text-xs py-2 px-3 rounded-lg w-64 focus:border-sage-600 outline-none transition"
                    value={newHabitInput}
                    onChange={(e) => setNewHabitInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleAddHabit()}
                  />
                  <button 
                    onClick={handleAddHabit}
                    className="bg-sage-800 hover:bg-black text-white text-xs font-bold py-2 px-5 rounded-lg transition"
                  >
                    Add Habit
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr className="bg-sage-100 text-sage-900 uppercase font-mono text-[10px] tracking-wider">
                      <th className="p-3 border-r border-sage-200 rounded-tl-lg">Habit Routine</th>
                      {DAYS.map((day, i) => (
                        <th key={day} className="p-3 text-center border-r border-sage-200">
                          {DAY_SHORT[i]}
                        </th>
                      ))}
                      <th className="p-3 text-center rounded-tr-lg">Progress Factor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {habits.map((habit) => {
                      const completedCount = habit.days.filter(Boolean).length;
                      const progressPct = Math.round((completedCount / 7) * 100);
                      return (
                        <tr key={habit.id} className="hover:bg-sage-50/40 border-b border-sage-100 transition-colors">
                          <td className="p-3 font-medium text-gray-700 border-r border-sage-100 flex items-center justify-between group min-w-[200px]">
                            <span>{habit.name}</span>
                            <button 
                              onClick={() => handleDeleteHabit(habit.id)}
                              className="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition duration-150"
                            >
                              🗑
                            </button>
                          </td>
                          {habit.days.map((checked, dayIdx) => (
                            <td key={dayIdx} className="p-3 text-center border-r border-sage-100">
                              <div 
                                onClick={() => handleToggleHabitDay(habit.id, dayIdx)}
                                className={`w-5.5 h-5.5 mx-auto rounded border flex items-center justify-center cursor-pointer transition-all ${
                                  checked 
                                    ? 'bg-sage-700 border-sage-700 text-white shadow-inner' 
                                    : 'bg-white border-gray-300 text-transparent hover:border-sage-400'
                                }`}
                              >
                                ✓
                              </div>
                            </td>
                          ))}
                          <td className="p-3 text-center">
                            <div className="flex items-center justify-center gap-3">
                              <div className="w-24 bg-gray-100 rounded-full h-2 overflow-hidden border border-gray-200">
                                <div 
                                  className="bg-sage-600 h-full rounded-full transition-all duration-300"
                                  style={{ width: `${progressPct}%` }}
                                />
                              </div>
                              <span className="font-mono text-[10.5px] font-bold text-sage-800 w-8 text-right">{progressPct}%</span>
                              {progressPct === 100 && (
                                <span className="text-amber-500 animate-pulse">🏆</span>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 7-Day Architecture Columns */}
            <div className="grid grid-cols-7 gap-3">
              {DAYS.map((day, idx) => {
                const targetDate = addDays(weekStart, idx);
                const dayTasks = tasks[day] || [];
                const totalCount = dayTasks.length;
                const doneCount = dayTasks.filter(t => t.done).length;
                const leftCount = totalCount - doneCount;
                const pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

                return (
                  <div 
                    key={day} 
                    className="bg-white border border-sage-200 rounded-xl overflow-hidden flex flex-col shadow-sm hover:shadow-md transition duration-200"
                  >
                    
                    {/* Day Header */}
                    <div className="bg-sage-800 text-white py-3 px-2 text-center relative">
                      <h3 className="font-serif text-[14px] font-bold tracking-wide">
                        {day}
                      </h3>
                      <span className="text-[10px] font-mono font-medium opacity-75 mt-0.5 block">
                        {fmtDate(targetDate)}
                      </span>
                    </div>

                    {/* Circular progress display */}
                    <div className="flex flex-col items-center py-4 bg-white border-b border-sage-50 shrink-0">
                      <div className="relative flex items-center justify-center">
                        <CircularDonut pct={pct} size={64} strokeWidth={5.5} />
                        <span className="absolute font-mono text-xs font-bold text-sage-900">{pct}%</span>
                      </div>
                    </div>

                    {/* Tasks layout segment */}
                    <div className="bg-black text-white py-1.5 text-center font-mono text-[9px] uppercase tracking-wider font-bold">
                      Tasks
                    </div>

                    {/* Interactive alternating matrix items */}
                    <div className="flex-1 min-h-[220px] max-h-[300px] overflow-y-auto custom-scrollbar p-2 space-y-1 bg-zinc-50/50">
                      {dayTasks.map((task, taskIdx) => (
                        <div 
                          key={task.id}
                          className={`flex items-center justify-between gap-1.5 p-2 rounded border border-sage-100 shadow-sm transition-all group ${
                            taskIdx % 2 === 0 ? 'bg-white' : 'bg-sage-50/30'
                          }`}
                        >
                          <span className={`text-[12px] font-medium leading-normal break-words flex-1 ${
                            task.done ? 'line-through text-gray-400 font-light' : 'text-gray-800'
                          }`}>
                            {task.text}
                          </span>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button 
                              onClick={() => handleDeleteTask(day, task.id)}
                              className="opacity-0 group-hover:opacity-100 text-[10px] text-gray-400 hover:text-red-500 transition duration-150"
                            >
                              🗑
                            </button>
                            <div 
                              onClick={() => handleToggleTask(day, task.id)}
                              className={`w-4 h-4 rounded border flex items-center justify-center cursor-pointer transition-all ${
                                task.done 
                                  ? 'bg-sage-600 border-sage-600 text-white' 
                                  : 'bg-white border-gray-300 text-transparent hover:border-sage-400'
                              }`}
                            >
                              ✓
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Commit inputs */}
                    <div className="p-2 border-t border-sage-100 bg-white">
                      <div className="flex items-center gap-1.5">
                        <input 
                          type="text" 
                          placeholder="Commit aligns..."
                          className="flex-1 bg-sage-50/50 border border-sage-200 text-xs py-1.5 px-2.5 rounded focus:border-sage-600 outline-none placeholder:opacity-40 transition"
                          value={newTaskInputs[day] || ""}
                          onChange={(e) => {
                            const v = e.target.value;
                            setNewTaskInputs(prev => ({ ...prev, [day]: v }));
                          }}
                          onKeyDown={(e) => e.key === "Enter" && handleAddTask(day)}
                        />
                        <button 
                          onClick={() => handleAddTask(day)}
                          className="text-lg font-bold text-sage-600 hover:text-sage-800 transition px-1"
                        >
                          +
                        </button>
                      </div>
                    </div>

                    {/* Metrics Done/Left Bar Segment */}
                    <div className="p-3 border-t border-sage-100 bg-white space-y-1.5 shrink-0 font-mono text-[9px] font-bold">
                      <div>
                        <div className="flex justify-between items-center mb-0.5 text-sage-900">
                          <span>Done</span>
                          <span>{doneCount}</span>
                        </div>
                        <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                          <div 
                            className="bg-sage-600 h-full rounded-full transition-all duration-500" 
                            style={{ width: `${totalCount ? (doneCount/totalCount)*100 : 0}%` }}
                          />
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between items-center mb-0.5 text-gray-700">
                          <span>Left</span>
                          <span>{leftCount}</span>
                        </div>
                        <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                          <div 
                            className="bg-gray-400 h-full rounded-full transition-all duration-500" 
                            style={{ width: `${totalCount ? (leftCount/totalCount)*100 : 0}%` }}
                          />
                        </div>
                      </div>
                    </div>

                  </div>
                );
              })}
            </div>

          </div>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
